name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHON_VERSION: "3.11"
  RAG_USE_FALLBACK: "true"
  USE_JSON_FALLBACK: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,model]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Test
        run: |
          pytest \
            --cov=agents/mcp_client --cov=agents/base_agent --cov=agents/home_agent \
            --cov=agents/trend_agent --cov=agents/tools --cov=mcp_servers \
            --cov=rag/service --cov=config --cov=db --cov=scripts/prime_database \
            --cov-report=term-missing \
            --cov-fail-under=75

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t meridian-retail-ai:ci .

      - name: Smoke test image imports
        run: |
          docker run --rm meridian-retail-ai:ci python -c "import agents, config, db, mcp_servers, rag"
