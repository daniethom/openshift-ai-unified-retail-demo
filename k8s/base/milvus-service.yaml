apiVersion: v1
kind: Service
metadata:
  name: milvus-service
  namespace: retail-ai-demo
  labels:
    app: milvus
spec:
  selector:
    app: milvus
  ports:
    - name: grpc
      protocol: TCP
      port: 19530
      targetPort: 19530
    - name: metrics
      protocol: TCP
      port: 9091
      targetPort: 9091
