# k8s/base/secret.yaml
# Replace placeholder values before deploying, or create the secret manually:
# oc create secret generic mcp-servers-secrets \
#   --from-literal=TAVILY_API_KEY='your_key' \
#   --from-literal=LLM_API_KEY='your_token' \
#   -n retail-ai-demo
apiVersion: v1
kind: Secret
metadata:
  name: mcp-servers-secrets
  namespace: retail-ai-demo
type: Opaque
stringData:
  TAVILY_API_KEY: "replace-me"
  LLM_API_KEY: "replace-me"
  HF_TOKEN: "replace-me"
  POSTGRES_PASSWORD: "change-me"
