apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: meridian-retail-ai
  namespace: retail-ai-demo
  labels:
    app: meridian-retail-ai
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: meridian-retail-ai:latest
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  runPolicy: Serial
